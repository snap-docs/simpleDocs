# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy simpleDocs backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: simpledocs-production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install, build, and test
        run: |
          npm ci
          npm run check
          npm test

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: backend
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BFFB0C2826AB4AE6BA32E96F167AAE15 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8A8FA7ADF84C4A328F60F63EC411A855 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B1A0E30D58554CD2BAB989D1321104C5 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'simpleDocs'
          slot-name: 'Production'
          package: backend

      - name: Configure anonymous access mode
        run: |
          resource_group=$(az webapp list --query "[?name=='simpleDocs'].resourceGroup | [0]" -o tsv)
          test -n "$resource_group"
          az webapp config appsettings set --resource-group "$resource_group" --name simpleDocs --settings APP_ENV=production AI_PROVIDER=groq AUTH_MODE=anonymous SKIP_AUTH=false GROQ_MODEL=openai/gpt-oss-120b

      - name: Sync encrypted provider keys when configured
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}
        run: |
          resource_group=$(az webapp list --query "[?name=='simpleDocs'].resourceGroup | [0]" -o tsv)
          test -n "$resource_group"

          if [ -n "$GROQ_API_KEY" ]; then
            az webapp config appsettings set --resource-group "$resource_group" --name simpleDocs --settings "GROQ_API_KEY=$GROQ_API_KEY" --output none
          else
            echo "GROQ_API_KEY Actions secret is not configured; preserving the existing Azure setting."
          fi

          if [ -n "$GROQ_API_KEY_FALLBACK" ]; then
            az webapp config appsettings set --resource-group "$resource_group" --name simpleDocs --settings "GROQ_API_KEY_FALLBACK=$GROQ_API_KEY_FALLBACK" --output none
          fi

      - name: Ensure App Service is running
        run: |
          resource_group=$(az webapp list --query "[?name=='simpleDocs'].resourceGroup | [0]" -o tsv)
          test -n "$resource_group"
          az webapp start --resource-group "$resource_group" --name simpleDocs

      - name: Verify required Azure app settings
        run: |
          resource_group=$(az webapp list --query "[?name=='simpleDocs'].resourceGroup | [0]" -o tsv)
          settings=$(az webapp config appsettings list --resource-group "$resource_group" --name simpleDocs --query "[].name" -o tsv)
          for required in APP_ENV AI_PROVIDER AUTH_MODE SKIP_AUTH GROQ_MODEL GROQ_API_KEY; do
            grep -qx "$required" <<< "$settings" || { echo "Missing Azure app setting: $required"; exit 1; }
          done

      - name: Verify deployed health endpoint
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 10 --max-time 30 https://simpledocs-e3ahgecnbaf2dcfu.centralindia-01.azurewebsites.net/api/health
          
