# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - simpleDocs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install, build, and test
        run: |
          npm ci
          npm run check
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: backend
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BFFB0C2826AB4AE6BA32E96F167AAE15 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8A8FA7ADF84C4A328F60F63EC411A855 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B1A0E30D58554CD2BAB989D1321104C5 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'simpleDocs'
          slot-name: 'Production'
          package: backend

      - name: Configure anonymous access mode
        run: |
          resource_group=$(az webapp list --query "[?name=='simpleDocs'].resourceGroup | [0]" -o tsv)
          test -n "$resource_group"
          az webapp config appsettings set --resource-group "$resource_group" --name simpleDocs --settings AUTH_MODE=anonymous SKIP_AUTH=false
          
